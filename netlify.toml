[build]
  publish = "site/"

# What's New Page traffic (any locale, any version, e.g. /sv-SE/whatsnew/153/)
# gets the English evergreen WNP rather than the generic error page. Netlify
# only allows a splat at the end of a path, so a :locale placeholder is used.
# Rules are matched top to bottom; these must stay above the catch-all.
[[redirects]]
  from = "/:locale/whatsnew/*"
  to = "/whatsnew.html"
  status = 200
  force = true

[[redirects]]
  from = "/whatsnew/*"
  to = "/whatsnew.html"
  status = 200
  force = true

# The CDN can send traffic for any www.mozilla.org path here during an
# outage, not just "/". Without this catch-all, anything other than the
# exact root path 404s instead of showing the error page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    # Cache-Control is deliberately NOT set here, so Netlify's default
    # (public, max-age=0, must-revalidate) still applies to browsers.
    # Browsers keep revalidating as they do today.
    #
    # CDN-Cache-Control targets downstream CDNs (Fastly in front of
    # Springfield's failover). Ten minutes is chosen to meaningfully
    # reduce Netlify request volume during a large Springfield outage
    # (e.g. a WNP outage during a Firefox release day) while keeping
    # propagation of any content fix here reasonably fast.
    CDN-Cache-Control = "public, max-age=600"

    # Both pages (index.html and whatsnew.html) are single self-contained HTML
    # files. Fonts, images, CSS and JS are inlined via <style>/<script> and data: URIs, so no external
    # subresources are ever fetched. The CSP reflects that:
    #
    #   default-src 'none'    everything below is opt-in
    #   style-src  'unsafe-inline'   inline <style> block
    #   script-src 'unsafe-inline'   inline <script> block
    #   img-src    data:            inlined favicons and CSS backgrounds
    #   font-src   data:            inlined woff2
    #   form-action 'none'          the picker form is JS-only, never submits
    #   frame-ancestors 'none'      not intended to be embedded
    #   base-uri 'none'             prevent <base> injection
    #
    # Anchor navigation (<a href="https://download.mozilla.org/...">) is not
    # gated by CSP fetch directives, so download links continue to work.
    Content-Security-Policy = "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; form-action 'none'; frame-ancestors 'none'; base-uri 'none'"
    X-Robots-Tag = "noindex"
